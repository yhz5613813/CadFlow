name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.10
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cadquery-ocp==7.9.3.1"
          python -m pip install --no-build-isolation ".[test,inspect]"
          python -m pip install vtk pillow
      - name: Build OCCT native core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build --parallel 2
      - name: Run regression suite
        run: python -m pytest -q --disable-warnings --tb=short

  fallback-build:
    name: Analytic fallback
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation ".[test]"
      - name: Build fallback core
        run: |
          cmake -S . -B build-fallback -DCMAKE_BUILD_TYPE=Release -DCADFLOW_USE_OCCT=OFF -DCADFLOW_WITH_STEP=OFF
          cmake --build build-fallback --parallel 2
          echo "CADFLOW_CORE_LIBRARY=$PWD/build-fallback/native/libcadflow_core.so" >> "$GITHUB_ENV"
      - name: Run fallback tests
        run: python -m pytest -q tests/test_native_backend.py --disable-warnings --tb=short

  distributions:
    name: Wheel and sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python -m pip install "cadquery-ocp==7.9.3.1"
      - name: Build distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Verify wheel install
        run: |
          python -m venv /tmp/cadflow-wheel
          /tmp/cadflow-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/cadflow-wheel/bin/python - <<'PY'
          import cadflow

          with cadflow.NativeSession() as session:
              assert "occt-7.9.3" in session.version
          with cadflow.Model() as model:
              assert abs(model.box(2, 3, 4).volume - 24.0) < 1e-9
          PY
      - name: Rebuild wheel from sdist
        run: |
          mkdir sdist-wheel
          python -m pip wheel dist/*.tar.gz --no-deps --no-build-isolation -w sdist-wheel
          test -n "$(find sdist-wheel -name '*.whl' -print -quit)"

  macos-wheel:
    name: macOS arm64 wheel
    runs-on: macos-14
    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine delocate
          python -m pip install "cadquery-ocp==7.9.3.1" py-slvs==1.0.6 "ocp-gordon>=0.2,<0.3"
      - name: Build distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Inspect wheel native dependencies
        run: |
          wheel unpack dist/*.whl -d wheel-unpack
          core="$(find wheel-unpack -name libcadflow_core.dylib -print -quit)"
          test -n "$core"
          file "$core" | grep -q arm64
          if otool -L "$core" | grep -E '/DLC/|/Users/|site-packages'; then
            echo "wheel contains a non-relocatable native dependency"
            exit 1
          fi
          otool -l "$core" | grep -q '@loader_path/../OCP/.dylibs'
          otool -l "$core" | grep -q '@loader_path/../vtkmodules/.dylibs'
      - name: Verify wheel install and regression suite
        run: |
          python -m venv "$RUNNER_TEMP/cadflow-wheel"
          "$RUNNER_TEMP/cadflow-wheel/bin/python" -m pip install dist/*.whl pytest ezdxf matplotlib pillow
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cadflow-wheel/bin/python" - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import cadflow

          with cadflow.NativeSession() as session:
              assert "occt-7.9.3" in session.version
          with TemporaryDirectory() as directory, cadflow.Model() as model:
              box = model.box(2, 3, 4)
              assert abs(box.volume - 24.0) < 1e-9
              path = Path(directory) / "box.step"
              box.export_step(path)
              imported = model.import_step(path)
              assert abs(imported.volume - 24.0) < 1e-9
              assert model.faces(box)[0].surface_metrics()["valid"] is True
          PY
          "$RUNNER_TEMP/cadflow-wheel/bin/python" -m pytest \
            --override-ini pythonpath= \
            -q --disable-warnings --tb=short \
            "$GITHUB_WORKSPACE/tests"
      - name: Rebuild wheel from sdist
        run: |
          mkdir "$RUNNER_TEMP/sdist-wheel"
          python -m pip wheel dist/*.tar.gz --no-deps --no-build-isolation -w "$RUNNER_TEMP/sdist-wheel"
          test -n "$(find "$RUNNER_TEMP/sdist-wheel" -name '*.whl' -print -quit)"

  scene-contract:
    name: Scene TypeScript parity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scene-contract/package-lock.json
      - name: Install Node dependencies
        working-directory: scene-contract
        run: npm ci
      - name: Run parity tests
        working-directory: scene-contract
        run: npm test
